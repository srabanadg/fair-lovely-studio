<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Fair & Lovely | Discussion Studio</title><style>
:root{--navy:#172b43;--blue:#275d85;--pale:#eef4f8;--bg:#f7f8fa;--line:#dce3e9;--muted:#586a79;--white:white}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--navy);font:16px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}header{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:3}.top{max-width:1280px;padding:15px 25px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font-size:18px;font-weight:800}.eyebrow{text-transform:uppercase;font-weight:800;letter-spacing:.12em;font-size:11px;color:var(--blue)}.wrap{max-width:1280px;margin:auto;padding:24px}.nav{display:flex;gap:7px;overflow:auto;padding:0 0 16px}.nav button{flex:0 0 auto;background:#fff;border:1px solid var(--line);border-radius:9px;padding:9px 12px;color:var(--navy)}.nav button.active{background:var(--navy);color:white}.panel{background:white;border:1px solid var(--line);border-radius:16px;padding:26px;margin-bottom:17px;box-shadow:0 5px 20px #1d355012}.hero{background:linear-gradient(130deg,#18374f,#2a6889);color:#fff;border-radius:17px;padding:26px;margin-bottom:18px}.hero p{color:#dce9f1}h1{font-size:clamp(28px,3vw,41px);line-height:1.12;margin:7px 0 10px}h2{font-size:23px;line-height:1.3;margin:0 0 14px}h3{font-size:17px;margin:12px 0}p{margin:9px 0 15px}.muted{color:var(--muted)}.light{color:#d4e7ef}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}.actions{display:flex;flex-wrap:wrap;gap:9px;align-items:center}.btn{background:var(--blue);color:#fff;border:1px solid var(--blue);border-radius:9px;padding:10px 14px;font-weight:700}.btn.secondary{background:#fff;color:var(--navy);border-color:#c4d0d9}.btn.small{font-size:13px;padding:7px 10px}.btn:disabled{opacity:.5}.prompt{padding:14px 17px;background:var(--pale);border-left:4px solid var(--blue);border-radius:7px}.editable{min-height:85px;width:100%;resize:vertical;border:1px solid #becbd6;border-radius:9px;padding:12px;color:var(--navy);background:#fff}.editable.short{min-height:53px}.fieldlabel{font-weight:750;font-size:13px;margin:10px 0 5px;display:block}.table{width:100%;border-collapse:collapse;table-layout:fixed}.table th{text-align:left;background:#e9f1f6;padding:14px;border:1px solid var(--line)}.table td{vertical-align:top;padding:12px;border:1px solid var(--line)}.table textarea{border:0;width:100%;min-height:230px;resize:vertical;padding:4px;background:transparent}.cards{display:flex;flex-wrap:wrap;gap:8px}.pill{background:#edf3f7;border:1px solid #d8e5ee;border-radius:80px;padding:7px 12px;font-size:14px}.flow{display:flex;align-items:stretch;flex-wrap:wrap;gap:8px;margin:20px 0}.flow .node{background:#eaf2f8;border:1px solid #bfd3e0;border-radius:10px;padding:12px;flex:1 1 145px;min-width:145px;text-align:center;font-size:14px;font-weight:700}.flow .arrow{align-self:center;font-size:21px;color:var(--blue)}.note{font-size:13px;color:var(--muted)}.foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:20px}.tag{background:#e7f0f6;color:#285d7d;padding:4px 9px;border-radius:20px;font-size:12px;font-weight:800}.timer{font-variant-numeric:tabular-nums;font-weight:850;font-size:20px}.teamcard{background:#f7fafc;border:1px solid var(--line);padding:18px;border-radius:12px}input[type=text]{width:100%;padding:10px;border:1px solid #becbd6;border-radius:8px}ol{padding-left:21px}.bar{height:12px;background:#e5ecf0;border-radius:10px;overflow:hidden}.hide{display:none}.preview{font-style:italic}.noPrint{}@media(max-width:730px){.wrap{padding:14px}.panel{padding:18px}.grid,.grid.three{grid-template-columns:1fr}.top{padding:12px 14px}.nav{padding-bottom:12px}.table th,.table td{padding:7px}.flow .arrow{display:none}.brand{font-size:16px}}@media print{header,.nav,.noPrint,.foot{display:none!important}body{background:white}.wrap{max-width:none}.panel,.hero{box-shadow:none;break-inside:avoid}}
</style></head><body><header><div class="top"><div><div class="eyebrow">GDBA · Marketing Management</div><div class="brand">Fair & Lovely Live Studio</div></div><div class="actions noPrint"><span class="timer" id="clock">00:00</span><button class="btn small secondary" id="clockToggle">Start timer</button><button class="btn small secondary" id="liveBtn">Live class</button><button class="btn small secondary" id="exportBtn">Export notes</button><button class="btn small secondary" id="importBtn">Import notes</button><input type="file" id="importFile" accept=".json" hidden></div></div></header><main class="wrap"><nav id="nav" class="nav noPrint"></nav><div id="screen"></div><div class="foot noPrint"><button id="prev" class="btn secondary">← Previous</button><span id="where" class="muted"></span><button id="next" class="btn">Next activity →</button></div></main><script>
const activities=['Beauty norms','Discontinue?','Arguments','Advertising','Messaging mechanics','Three lenses','Ad redesign'];
const key='fl-discussion-studio-v1';let state={page:0,reveal:{fl:0,specific:0,dove:0},notes:{},teams:Array.from({length:7},(_,i)=>({name:'Simulation Team '+(i+1)}))},tick=null,seconds=0;try{const saved=JSON.parse(localStorage.getItem(key));if(saved&&typeof saved==='object')state={...state,...saved}}catch{};
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
state.reveal={fl:0,specific:0,dove:0,...(state.reveal||{})};function persist(){localStorage.setItem(key,JSON.stringify(state))}function area(id,placeholder='',height=''){return `<textarea class="editable ${height}" data-note="${esc(id)}" >${esc(state.notes[id]||'')}</textarea>`}function tabulate(cols,ids,placeholders=[]){return `<div style="overflow-x:auto"><table class="table"><thead><tr>${cols.map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead><tbody><tr>${ids.map((id,i)=>`<td>${area(id,placeholders[i]||'Enter arguments as students contribute…')}</td>`).join('')}</tr></tbody></table></div>`}function title(k,question,intro){return `<section class="hero"><div class="eyebrow light">Activity ${k+1}</div><h1>${question}</h1></section>`}
function stage(k){switch(k){case 0:return title(k,'What beauty ideals are popular today?','Students identify current trends and norms before you discuss patterns, beneficiaries, and costs.')+`<div class="panel"><h2>Collect the trends</h2>${area('norms','Add one trend per line (for example: skin texture, body shape, anti-aging, filters, hair, complexion)…')}<div class="grid"><div><label class="fieldlabel">What patterns do we notice?</label>${area('patterns','Who defines the ideal? How does it circulate?')}</div><div><label class="fieldlabel">Who benefits, and who might be harmed?</label>${area('winners','Brands, creators, platforms, consumers; exclusion, pressure, stigma…')}</div></div></div>`;
case 1:return title(k,'Should HUL discontinue Fair & Lovely?','Take a position before hearing the arguments. Students vote individually on their phones or laptops.')+`<div class="panel"><div class="prompt"><strong>Class poll:</strong> If a product relies on a persistent and harmful beauty ideal, should Hindustan Unilever discontinue it?</div><div class="grid" style="margin:15px 0"><div class="teamcard"><h3>Discontinue</h3><div id="voteStop" style="font-size:32px;font-weight:800">0</div><div class="bar"><div id="barStop" style="background:#c46a59;width:0%;height:100%"></div></div></div><div class="teamcard"><h3>Continue</h3><div id="voteKeep" style="font-size:32px;font-weight:800">0</div><div class="bar"><div id="barKeep" style="background:#338a81;width:0%;height:100%"></div></div></div></div><p class="muted"><span id="pollCount">0</span> votes received. <span id="pollStatus"></span></p><div class="actions"><button class="btn secondary" id="toggleVote">Hide / reveal results</button><button class="btn secondary" id="resetVotes">Clear votes for this session</button></div></div>`;
case 2:return title(k,'What is the strongest case on each side?','Build the arguments with students rather than displaying a predetermined answer.')+`<div class="panel"><h2>Live argument board</h2>${tabulate(['Discontinue','Continue'],['discontinue','continue'],['Enter reasons to discontinue…','Enter reasons to continue…'])}</div>`;
case 3:return title(k,'What narrative is each brand selling?','Show selected legacy Fair & Lovely ads, then a Dove ad. Compare the stories, not just the products.')+`<div class="panel"><h2>Advertising narrative comparison</h2>${tabulate(['Dove','Fair & Lovely'],['dove','fair'],['What narrative is Dove advancing?','What narrative is Fair & Lovely advancing?'])}</div>`;
case 4:{
const fl=['Brand','Makes a claim of improvement','Promises social / emotional benefit','Creates aspiration or insecurity','Triggers purchase'];
const dove=['Brand','Counter-message','Confidence','No transformation narrative'];
const n=state.reveal.fl, q=state.reveal.specific, m=state.reveal.dove;
const flow=(items,count)=>`<div class="flow" aria-live="polite">${items.slice(0,count).map((name,i)=>`${i?'<span class="arrow">→</span>':''}<div class="node">${esc(name)}</div>`).join('')}</div>`;
const specificFlow=`<div class="flow" aria-live="polite">${fl.slice(0,q).map((name,i)=>`${i?'<span class="arrow">→</span>':''}<div class="node"><div style="font-size:12px;color:var(--muted);margin-bottom:9px">${esc(name)}</div>${area('flSpecific'+i,'','short')}</div>`).join('')}</div>`;
return title(k,'How does the message create demand?')+`<div class="panel"><h2>Messaging framework</h2>${flow(fl,n)}<div class="actions noPrint"><button type="button" class="btn" id="revealFl" ${n>=fl.length?'disabled':''}>${n===0?'Reveal first box':'Reveal next box'} →</button><button type="button" class="btn secondary" id="resetFl" ${n===0?'disabled':''}>Reset framework</button></div>${n===fl.length?`<div style="border-top:1px solid var(--line);margin-top:28px;padding-top:22px"><h2>Apply the framework to Fair & Lovely</h2><p>What does Fair & Lovely communicate at each stage?</p>${specificFlow}<div class="actions noPrint"><button type="button" class="btn" id="revealSpecific" ${q>=fl.length?'disabled':''}>${q===0?'Reveal first F&L box':'Reveal next F&L box'} →</button><button type="button" class="btn secondary" id="resetSpecific" ${q===0?'disabled':''}>Reset F&L boxes</button></div></div>`:''}${n===fl.length&&q===fl.length?`<div style="border-top:1px solid var(--line);margin-top:28px;padding-top:22px"><h2>How does Dove alter the logic?</h2>${flow(dove,m)}<div class="actions noPrint"><button type="button" class="btn" id="revealDove" ${m>=dove.length?'disabled':''}>${m===0?'Reveal first Dove box':'Reveal next Dove box'} →</button><button type="button" class="btn secondary" id="resetDove" ${m===0?'disabled':''}>Reset Dove</button></div></div>`:''}</div>`;
}
case 5:return title(k,'Evaluate the brand through three lenses','Financial, legal/regulatory, and ethical/societal considerations may point toward different decisions.')+`<div class="panel"><h2>Live three-lens board</h2>${tabulate(['Financial','Legal / regulatory','Ethical / societal'],['financial','legal','ethical'],['Revenue, profit, consumer demand, competitors, transitions…','Claims, evidence, advertising standards, discrimination, jurisdictions…','Colourism, consumer autonomy, dignity, cultural norms, harms…'])}</div>`;
case 6:return title(k,'Redesign the Fair & Lovely advertisement','Seven existing simulation teams work in seven Zoom breakout rooms. AI-created storyboards are welcome, but teams own and defend their decisions.')+`<div class="panel"><div class="grid"><div><h2>Seven-team brief</h2><p>Redesign a legacy Fair & Lovely television advertisement. <strong>Do not reinforce colourism.</strong> Preserve a credible reason for consumers to buy.</p><ol><li>Identify the harmful message in the original ad.</li><li>Write a new value proposition and a <strong>three-scene storyboard</strong>.</li><li>Justify it through commercial, legal and ethical lenses.</li><li>Explain how the campaign would work responsibly on TikTok, Instagram or YouTube, including beauty filters, creators and algorithmic targeting.</li></ol><div class="prompt"><strong>AI permitted:</strong> You may use generative AI to brainstorm or visualize a storyboard. Your team must select, critique and revise the output. Disclose the tool and its role. Avoid AI-generated skin-lightening before/after imagery or misleading product claims.</div></div><div class="teamcard"><h3>Team process</h3><p><strong>Breakout rooms:</strong> Work with your existing simulation team to design your ad.</p><p><strong>Return to class:</strong> Be ready to give a brief pitch explaining your creative and commercial decisions.</p></div></div><div class="prompt" style="margin-top:20px"><strong>To submit your team’s work:</strong> In your Zoom breakout room, choose one team member as your scribe. The scribe opens the <a href="student.html" target="_blank" rel="noopener">student workspace</a>, selects your simulation team (1–7), completes the storyboard and submits your team’s concept. The rest of the team should discuss and review the answers together.</div><h2 style="margin-top:22px">Team submissions</h2><div class="grid" id="teamFeed">${Array.from({length:7},(_,i)=>`<div class="teamcard"><strong>Simulation Team ${i+1}</strong><p class="muted">Awaiting submission</p></div>`).join('')}</div><div class="actions" style="margin-top:14px"><button class="btn secondary" id="compareTeams">Compare seven teams</button></div><div id="comparePanel"></div></div>`;
}}
function render(){document.getElementById('nav').innerHTML=activities.map((label,i)=>`<button class="${i===state.page?'active':''}" data-tab="${i}">${i+1}. ${esc(label)}</button>`).join('');document.getElementById('screen').innerHTML=stage(state.page);document.getElementById('where').textContent=`Activity ${state.page+1} of 7`;document.getElementById('prev').disabled=state.page===0;document.getElementById('next').disabled=state.page===6;document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>go(+b.dataset.tab));document.querySelectorAll('[data-note]').forEach(el=>el.addEventListener('input',()=>{state.notes[el.dataset.note]=el.value;persist()}));if(state.page===4){
const bind=(id,fn)=>{const b=document.getElementById(id);if(b)b.addEventListener('click',fn)};
bind('revealFl',()=>{state.reveal.fl=Math.min(5,state.reveal.fl+1);persist();render()});
bind('resetFl',()=>{state.reveal.fl=0;state.reveal.specific=0;state.reveal.dove=0;persist();render()});
bind('revealSpecific',()=>{state.reveal.specific=Math.min(5,state.reveal.specific+1);persist();render()});
bind('resetSpecific',()=>{state.reveal.specific=0;state.reveal.dove=0;persist();render()});
bind('revealDove',()=>{state.reveal.dove=Math.min(4,state.reveal.dove+1);persist();render()});
bind('resetDove',()=>{state.reveal.dove=0;persist();render()});
}
if(state.page===1)window.setupPollControls?.();if(state.page===6)window.setupTeamControls?.();}function go(i){state.page=Math.max(0,Math.min(6,i));persist();render();window.scrollTo({top:0,behavior:'instant'})}document.getElementById('prev').onclick=()=>go(state.page-1);document.getElementById('next').onclick=()=>go(state.page+1);document.getElementById('exportBtn').onclick=()=>{const blob=new Blob([JSON.stringify({version:1,exportedAt:new Date().toISOString(),...state},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='fair-lovely-discussion-notes.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),3000)};document.getElementById('importBtn').onclick=()=>document.getElementById('importFile').click();document.getElementById('importFile').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const data=JSON.parse(await f.text());if(!data.notes||typeof data.notes!=='object')throw Error();if(!confirm('Replace the notes currently stored in this browser?'))return;state={...state,...data,page:Math.min(6,Math.max(0,+data.page||0))};persist();render()}catch{alert('This does not appear to be a valid Studio notes file.')}e.target.value=''};function updateClock(){document.getElementById('clock').textContent=String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0')}document.getElementById('clockToggle').onclick=e=>{if(tick){clearInterval(tick);tick=null;e.target.textContent='Resume timer'}else{tick=setInterval(()=>{seconds++;updateClock()},1000);e.target.textContent='Pause timer'}};render();
</script><script src="config.js"></script><script type="module" src="live.js"></script></body></html>
